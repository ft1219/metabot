# TEMPORARY: proves the lab's AI check against the real OpenAI API on this
# branch before merging (two checks, nothing saved, nothing bought). Removed
# again before the pull request is merged.
name: Try the AI check (temporary)
on:
  push:
    branches: [follow-move-ai]
    paths: [".github/workflows/try-ai-check.yaml", "polymarket-lab/ai_check.py"]
permissions:
  contents: read
jobs:
  try:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Two AI checks on markets moving right now
        working-directory: polymarket-lab
        run: python3 ai_check.py --try 2
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
