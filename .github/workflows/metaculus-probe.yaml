name: Metaculus - one-off shape probe
on:
  push:
    branches: [metaculus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Reference bots per resolved question (FutureEval + MiniBench 33135)
        run: python3 -u probe/probe_ref_bots.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
      - name: Same for MiniBench 33132
        run: python3 -u probe/probe_ref_bots.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
          MB_PROJECT: "33132"
