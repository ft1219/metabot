name: Metaculus - one-off shape probe
on:
  push:
    branches: [metaculus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: FutureEval question schedule (read-only)
        run: python3 -u probe/question_schedule.py
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }}
