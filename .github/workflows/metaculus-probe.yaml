name: Metaculus - one-off shape probe
on:
  push:
    branches: [metaculus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Who hosts the parse-fallback candidates on OpenRouter
        run: python3 -u probe/openrouter_hosts.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TRY_MODELS: google/gemini-3.8-flash google/gemini-3.7-flash
