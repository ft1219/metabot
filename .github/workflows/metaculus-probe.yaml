name: Metaculus - one-off shape probe
on:
  push:
    branches: [metaculus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: What cron-job.org recorded for the timer jobs
        run: python3 -u probe/cron_history.py
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
