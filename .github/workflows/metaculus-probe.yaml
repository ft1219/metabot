name: Metaculus - one-off shape probe
on:
  push:
    branches: [metaculus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: OpenRouter requests by provider (read-only)
        run: python3 -u probe/openrouter_activity.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
