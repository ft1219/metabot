name: Metaculus - one-off shape probe
on:
  push:
    branches: [metaculus-probe]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check the Claude API key (free model lookup + one tiny request)
        run: python3 -u probe/anthropic_key_check.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
